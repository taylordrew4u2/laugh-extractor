name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version

      - name: Build and test
        run: |
          set -euo pipefail
          # Ad-hoc signing, not "no signing": the app is sandboxed, and macOS
          # refuses to launch an unsigned sandboxed test host.
          xcodebuild test \
            -project LaughExtractor.xcodeproj \
            -scheme LaughExtractor \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            OTHER_CODE_SIGN_FLAGS=""

      # Temporary: the SoundAnalysis header is the only authoritative source for
      # SNTimeDurationConstraint's shape. Runs last so it lands in the log tail.
      # Remove once window-duration clamping is written against it.
      - name: Dump SoundAnalysis API surface
        if: always()
        run: |
          SDK=$(xcrun --show-sdk-path)

          # An empty switch makes the compiler list every missing case, which is
          # a definitive answer whether or not the type is an enum.
          cat > /tmp/probe.swift <<'SWIFT'
          import SoundAnalysis
          func probeCases(_ c: SNTimeDurationConstraint) {
              switch c {}
          }
          func probeMembers(_ c: SNTimeDurationConstraint) {
              c.__nonexistent_member_to_list_the_real_ones
          }
          SWIFT
          echo "=== compiler probe ==="
          xcrun swiftc -sdk "$SDK" -target arm64-apple-macos14.0 \
            -typecheck /tmp/probe.swift 2>&1 | head -60 || true

          echo "=== swiftinterface ==="
          for f in $(find "$SDK" -name "*.swiftinterface" -path "*SoundAnalysis*" 2>/dev/null | head -3); do
            echo "--- $f"
            grep -h -B 2 -A 20 "SNTimeDurationConstraint" "$f" | head -60 || true
          done
